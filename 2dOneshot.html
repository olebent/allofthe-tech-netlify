<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Emoji Plattformspill</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #87CEEB;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    // Initialiserer canvas
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Globale variabler
    let score = 0;
    let currentLevelIndex = 0;
    let levels = [];
    let player = {};
    let keys = { left: false, right: false, up: false };

    const gravity = 0.5;
    const jumpVelocity = -12;
    const moveSpeed = 5;

    // Lager 10 nivåer med plattformer, fiender og et målområde (døren)
    function createLevels() {
      let lvls = [];
      // Nivå 1: Enkel plattform over hele bunnen
      lvls.push({
        platforms: [
          {x: 0, y: canvas.height - 50, width: canvas.width, height: 50}
        ],
        enemies: [
          {x: canvas.width/2, y: canvas.height - 90, width: 40, height: 40, alive: true, explosionTime: 0}
        ],
        finish: {x: canvas.width - 100, y: canvas.height - 100, width: 50, height: 50}
      });
      // Nivå 2 til 10: Flere plattformer med varierende høyder og flere fiender
      for(let i = 2; i <= 10; i++){
        let platforms = [];
        let enemies = [];
        const platformCount = 5 + i; // Flere plattformer for høyere nivåer
        const platformWidth = canvas.width / (platformCount);
        for(let j = 0; j < platformCount; j++){
          let x = j * platformWidth;
          let y = canvas.height - 50 - (Math.random() * 100 + i * 10);
          platforms.push({x: x, y: y, width: platformWidth - 20, height: 20});
          // Legg til fiende med 70% sjanse på hver plattform
          if(Math.random() < 0.7) {
            enemies.push({x: x + platformWidth/2 - 20, y: y - 40, width: 40, height: 40, alive: true, explosionTime: 0});
          }
        }
        // Legg til en siste plattform nær målområdet
        platforms.push({x: canvas.width - 150, y: canvas.height - 150, width: 150, height: 20});
        lvls.push({
          platforms: platforms,
          enemies: enemies,
          finish: {x: canvas.width - 100, y: canvas.height - 200, width: 50, height: 50}
        });
      }
      return lvls;
    }
    levels = createLevels();

    // Initialiserer spillerens posisjon og egenskaper
    function resetPlayer() {
      player = {
        x: 50,
        y: canvas.height - 100,
        width: 40,
        height: 40,
        vx: 0,
        vy: 0,
        onGround: false
      };
    }
    resetPlayer();

    // Håndterer tastaturinput
    document.addEventListener('keydown', function(e) {
      if(e.key === "ArrowLeft" || e.key === "a") keys.left = true;
      if(e.key === "ArrowRight" || e.key === "d") keys.right = true;
      if(e.key === "ArrowUp" || e.key === "w" || e.key === " ") {
        if(player.onGround) {
          player.vy = jumpVelocity;
          player.onGround = false;
        }
        keys.up = true;
      }
    });
    document.addEventListener('keyup', function(e) {
      if(e.key === "ArrowLeft" || e.key === "a") keys.left = false;
      if(e.key === "ArrowRight" || e.key === "d") keys.right = false;
      if(e.key === "ArrowUp" || e.key === "w" || e.key === " ") keys.up = false;
    });

    // Variabler for konfetti
    let confettiParticles = [];
    let confettiActive = false;
    function startConfetti() {
      confettiActive = true;
      // Opprett 100 konfettideler med tilfeldig posisjon og fart
      for(let i = 0; i < 100; i++){
        confettiParticles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.5) * 10,
          emoji: Math.random() < 0.5 ? "🎉" : "🎊",
          life: 100
        });
      }
    }

    // Spill-løkken
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // Oppdaterer spilltilstanden
    function update() {
      let level = levels[currentLevelIndex];

      // Spilleren beveger seg horisontalt
      if(keys.left) {
        player.vx = -moveSpeed;
      } else if(keys.right) {
        player.vx = moveSpeed;
      } else {
        player.vx = 0;
      }

      // Påfører tyngdekraft og oppdaterer posisjon
      player.vy += gravity;
      player.x += player.vx;
      player.y += player.vy;

      // Sjekker kollisjon med plattformer
      player.onGround = false;
      for(let plat of level.platforms) {
        if(player.x < plat.x + plat.width && player.x + player.width > plat.x &&
           player.y < plat.y + plat.height && player.y + player.height > plat.y) {
          if(player.vy >= 0) {
            player.y = plat.y - player.height;
            player.vy = 0;
            player.onGround = true;
          }
        }
      }

      // Holder spilleren innenfor skjermen
      if(player.x < 0) player.x = 0;
      if(player.x + player.width > canvas.width) player.x = canvas.width - player.width;
      if(player.y > canvas.height) {
        // Hvis spilleren faller av, start nivået på nytt
        resetPlayer();
      }

      // Kollisjon med fiender
      for(let enemy of level.enemies) {
        if(enemy.alive) {
          if(player.x < enemy.x + enemy.width && player.x + player.width > enemy.x &&
             player.y < enemy.y + enemy.height && player.y + player.height > enemy.y) {
            // Sjekker om kollisjonen skjer fra oven
            if(player.vy > 0 && (player.y + player.height - enemy.y) < 20) {
              enemy.alive = false;
              enemy.explosionTime = Date.now() + 200; // vis 💥 i 200ms
              score += 100;
              player.vy = jumpVelocity / 2;
            } else {
              // Her kan man evt. legge inn en effekt hvis spilleren treffer fienden fra siden
            }
          }
        } else {
          // Fjern fiende etter eksplosjonen
          if(enemy.explosionTime && Date.now() > enemy.explosionTime) {
            enemy.remove = true;
          }
        }
      }
      level.enemies = level.enemies.filter(e => !e.remove);

      // Sjekker om spilleren har nådd målområdet (døren)
      let finish = level.finish;
      if(player.x < finish.x + finish.width && player.x + player.width > finish.x &&
         player.y < finish.y + finish.height && player.y + player.height > finish.y) {
        if(currentLevelIndex < levels.length - 1) {
          currentLevelIndex++;
          resetPlayer();
        } else {
          // Siste nivå fullført: aktiver konfettti
          startConfetti();
        }
      }

      // Oppdaterer konfetti
      if(confettiActive) {
        for(let p of confettiParticles) {
          p.x += p.vx;
          p.y += p.vy;
          p.life--;
        }
        confettiParticles = confettiParticles.filter(p => p.life > 0);
      }
    }

    // Tegner spillobjektene
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let level = levels[currentLevelIndex];

      // Tegner plattformene
      ctx.fillStyle = "#654321";
      for(let plat of level.platforms) {
        ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
      }

      // Tegner målområdet som en dør (🚪)
      let finish = level.finish;
      ctx.font = "30px serif";
      ctx.fillText("🚪", finish.x, finish.y + finish.height);

      // Tegner spilleren som en emoji (😀)
      ctx.font = "40px serif";
      ctx.fillText("😀", player.x, player.y + player.height);

      // Tegner fiender (🐻) eller eksplosjon (💥) hvis de dør
      ctx.font = "40px serif";
      for(let enemy of level.enemies) {
        if(enemy.alive) {
          ctx.fillText("🐻", enemy.x, enemy.y + enemy.height);
        } else {
          if(Date.now() < enemy.explosionTime) {
            ctx.fillText("💥", enemy.x, enemy.y + enemy.height);
          }
        }
      }

      // Tegner poengsummen
      ctx.fillStyle = "#000";
      ctx.font = "20px sans-serif";
      ctx.fillText("Score: " + score, 10, 30);

      // Tegner konfettti hvis aktivert
      if(confettiActive) {
        ctx.font = "20px serif";
        for(let p of confettiParticles) {
          ctx.fillText(p.emoji, p.x, p.y);
        }
      }
    }

    // Start spill-løkken
    gameLoop();
  </script>
</body>
</html>
