<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Emoji Plattformspill</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #87CEEB;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    // Hent canvas og kontekst
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Globale variabler
    let score = 0;
    let currentLevelIndex = 0;
    let levels = [];
    let player = {};
    let keys = { left: false, right: false, up: false };

    // Spillhastigheter og fysikk
    const gravity = 0.5;
    const jumpVelocity = -12;
    const moveSpeed = 5;

    // For å spore spillerens inaktivitet (for å bytte sprite)
    let lastMoveTime = Date.now();
    // Når nivået er fullført settes denne, og så vises 🤸 i 300 ms
    let levelCompleteTime = null;

    // Liste over dyre-emoji som skal plasseres på plattformene
    const animalTypes = ["🦘", "🦑", "🫎", "🦙", "🐙", "🐖", "🐄", "🐂", "🐨"];

    // Lager 10 nivåer med plattformer, fiender, finish og dyr
    function createLevels() {
      let lvls = [];
      // Nivå 1: Enkel plattform over hele bunnen
      {
        let platforms = [
          {x: 0, y: canvas.height - 50, width: canvas.width, height: 50}
        ];
        let enemies = [
          {x: canvas.width/2, y: canvas.height - 90, width: 40, height: 40, alive: true, explosionTime: 0}
        ];
        let animals = [];
        // Legg med en viss sannsynlighet et dyr på hver plattform
        platforms.forEach(plat => {
          if(Math.random() < 0.3) {
            let type = animalTypes[Math.floor(Math.random() * animalTypes.length)];
            let x = plat.x + Math.random() * (plat.width - 40);
            animals.push({
              x: x,
              y: plat.y - 40,
              width: 40,
              height: 40,
              vx: (Math.random() < 0.5 ? -1 : 1) * (Math.random() * 2 + 1),
              vy: 0,
              type: type,
              platformX: plat.x,
              platformRight: plat.x + plat.width,
              platformY: plat.y,
              jumpCooldown: 0
            });
          }
        });
        lvls.push({
          platforms: platforms,
          enemies: enemies,
          animals: animals,
          finish: {x: canvas.width - 100, y: canvas.height - 100, width: 50, height: 50}
        });
      }
      // Nivå 2 til 10
      for(let i = 2; i <= 10; i++){
        let platforms = [];
        let enemies = [];
        const platformCount = 5 + i; // Flere plattformer for høyere nivåer
        const platformWidth = canvas.width / platformCount;
        for(let j = 0; j < platformCount; j++){
          let x = j * platformWidth;
          let y = canvas.height - 50 - (Math.random() * 100 + i * 10);
          platforms.push({x: x, y: y, width: platformWidth - 20, height: 20});
          // Legg til fiende med 70% sjanse på hver plattform
          if(Math.random() < 0.7) {
            enemies.push({x: x + platformWidth/2 - 20, y: y - 40, width: 40, height: 40, alive: true, explosionTime: 0});
          }
        }
        // En siste plattform nær målområdet
        platforms.push({x: canvas.width - 150, y: canvas.height - 150, width: 150, height: 20});

        // Legg til dyr på noen av plattformene
        let animals = [];
        platforms.forEach(plat => {
          if(Math.random() < 0.3) {
            let type = animalTypes[Math.floor(Math.random() * animalTypes.length)];
            let x = plat.x + Math.random() * (plat.width - 40);
            animals.push({
              x: x,
              y: plat.y - 40,
              width: 40,
              height: 40,
              vx: (Math.random() < 0.5 ? -1 : 1) * (Math.random() * 2 + 1),
              vy: 0,
              type: type,
              platformX: plat.x,
              platformRight: plat.x + plat.width,
              platformY: plat.y,
              jumpCooldown: 0
            });
          }
        });
        lvls.push({
          platforms: platforms,
          enemies: enemies,
          animals: animals,
          finish: {x: canvas.width - 100, y: canvas.height - 200, width: 50, height: 50}
        });
      }
      return lvls;
    }
    levels = createLevels();

    // Nullstiller spilleren slik at den starter på den første plattformen i nivået
    function resetPlayer() {
      let level = levels[currentLevelIndex];
      let startPlatform = level.platforms[0];
      player = {
        x: startPlatform.x + 10,
        y: startPlatform.y - 40,
        width: 40,
        height: 40,
        vx: 0,
        vy: 0,
        onGround: false
      };
      lastMoveTime = Date.now();
    }
    resetPlayer();

    // Tastaturhåndtering
    document.addEventListener('keydown', function(e) {
      if(e.key === "ArrowLeft" || e.key === "a") keys.left = true;
      if(e.key === "ArrowRight" || e.key === "d") keys.right = true;
      if(e.key === "ArrowUp" || e.key === "w" || e.key === " ") {
        if(player.onGround) {
          player.vy = jumpVelocity;
          player.onGround = false;
        }
        keys.up = true;
      }
    });
    document.addEventListener('keyup', function(e) {
      if(e.key === "ArrowLeft" || e.key === "a") keys.left = false;
      if(e.key === "ArrowRight" || e.key === "d") keys.right = false;
      if(e.key === "ArrowUp" || e.key === "w" || e.key === " ") keys.up = false;
    });

    // Variabler for konfetti
    let confettiParticles = [];
    let confettiActive = false;
    function startConfetti() {
      confettiActive = true;
      // Opprett 100 konfettideler med tilfeldig posisjon og fart
      for(let i = 0; i < 100; i++){
        confettiParticles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.5) * 10,
          emoji: Math.random() < 0.5 ? "🎉" : "🎊",
          life: 100
        });
      }
    }

    // Spill-løkken
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // Oppdaterer spilltilstanden
    function update() {
      let level = levels[currentLevelIndex];

      // Spilleren beveger seg horisontalt
      if(keys.left) {
        player.vx = -moveSpeed;
      } else if(keys.right) {
        player.vx = moveSpeed;
      } else {
        player.vx = 0;
      }
      // Oppdater idle-timer
      if(Math.abs(player.vx) > 0) {
        lastMoveTime = Date.now();
      }

      // Påfører tyngdekraft og oppdaterer posisjon
      player.vy += gravity;
      player.x += player.vx;
      player.y += player.vy;

      // Kollisjon med plattformer for spilleren
      player.onGround = false;
      for(let plat of level.platforms) {
        if(player.x < plat.x + plat.width && player.x + player.width > plat.x &&
           player.y < plat.y + plat.height && player.y + player.height > plat.y) {
          if(player.vy >= 0) {
            player.y = plat.y - player.height;
            player.vy = 0;
            player.onGround = true;
          }
        }
      }

      // Hold spilleren innenfor skjermen
      if(player.x < 0) player.x = 0;
      if(player.x + player.width > canvas.width) player.x = canvas.width - player.width;
      if(player.y > canvas.height) {
        // Spilleren faller – nullstill posisjonen (beholder score)
        resetPlayer();
      }

      // Kollisjon med fiender
      for(let enemy of level.enemies) {
        if(enemy.alive) {
          if(player.x < enemy.x + enemy.width && player.x + player.width > enemy.x &&
             player.y < enemy.y + enemy.height && player.y + player.height > enemy.y) {
            // Treffer fra oven: drep fienden
            if(player.vy > 0 && (player.y + player.height - enemy.y) < 20) {
              enemy.alive = false;
              enemy.explosionTime = Date.now() + 200; // 💥 i 200ms
              score += 100;
              player.vy = jumpVelocity / 2;
            } else {
              // Eventuelt: annen effekt ved sidekollisjon
            }
          }
        } else {
          if(enemy.explosionTime && Date.now() > enemy.explosionTime) {
            enemy.remove = true;
          }
        }
      }
      level.enemies = level.enemies.filter(e => !e.remove);

      // Oppdater dyra (de skal ikke falle av plattformen)
      if(level.animals) {
        level.animals.forEach(animal => {
          // Enkel hopp-logikk: om dyret står på plattformen og har lav cooldown, kan det hoppe
          if(animal.y >= animal.platformY - animal.height - 1) {
            animal.y = animal.platformY - animal.height;
            animal.vy = 0;
            if(animal.jumpCooldown <= 0 && Math.random() < 0.01) {
              animal.vy = jumpVelocity * 0.8; // noe mindre hopp
              animal.jumpCooldown = 50; // cooldown-tid
            }
          } else {
            animal.vy += gravity;
          }
          animal.x += animal.vx;
          animal.y += animal.vy;
          if(animal.jumpCooldown > 0) animal.jumpCooldown--;

          // Sjekk at dyret ikke går utenfor plattformen
          if(animal.x < animal.platformX) {
            animal.x = animal.platformX;
            animal.vx *= -1;
          }
          if(animal.x + animal.width > animal.platformRight) {
            animal.x = animal.platformRight - animal.width;
            animal.vx *= -1;
          }
          // Tilfeldig retningsbytte
          if(Math.random() < 0.005) {
            animal.vx *= -1;
          }
        });
      }

      // Sjekk om spilleren har nådd finish-området (🚪)
      let finish = level.finish;
      if(player.x < finish.x + finish.width && player.x + player.width > finish.x &&
         player.y < finish.y + finish.height && player.y + player.height > finish.y) {
        // Nivå fullført – bruk 300 ms med 🤸-sprite før neste nivå eller konfetti på siste nivå
        if(currentLevelIndex < levels.length - 1) {
          if (!levelCompleteTime) {
            levelCompleteTime = Date.now();
          } else if (Date.now() - levelCompleteTime >= 300) {
            currentLevelIndex++;
            resetPlayer();
            levelCompleteTime = null;
          }
        } else {
          if (!levelCompleteTime) {
            levelCompleteTime = Date.now();
          } else if (Date.now() - levelCompleteTime >= 300) {
            startConfetti();
          }
        }
      }

      // Oppdater konfetti
      if(confettiActive) {
        confettiParticles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.life--;
        });
        confettiParticles = confettiParticles.filter(p => p.life > 0);
      }
    }

    // Tegner spillobjektene
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let level = levels[currentLevelIndex];

      // Tegn plattformer
      ctx.fillStyle = "#654321";
      level.platforms.forEach(plat => {
        ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
      });

      // Tegn finish (🚪)
      let finish = level.finish;
      ctx.font = "30px serif";
      ctx.fillText("🚪", finish.x, finish.y + finish.height);

      // Tegn fiender (🐻) eller eksplosjon (💥) om de dør
      ctx.font = "40px serif";
      level.enemies.forEach(enemy => {
        if(enemy.alive) {
          ctx.fillText("🐻", enemy.x, enemy.y + enemy.height);
        } else {
          if(Date.now() < enemy.explosionTime) {
            ctx.fillText("💥", enemy.x, enemy.y + enemy.height);
          }
        }
      });

      // Tegn dyr (med deres respektive emoji)
      ctx.font = "40px serif";
      if(level.animals) {
        level.animals.forEach(animal => {
          ctx.fillText(animal.type, animal.x, animal.y + animal.height);
        });
      }

      // Bestem hvilken emoji som skal representere spilleren
      let playerSprite = "🧍"; // standard
      if(levelCompleteTime && Date.now() - levelCompleteTime < 300) {
        playerSprite = "🤸";
      } else if(player.vx !== 0) {
        playerSprite = "🏃";
      } else if(Date.now() - lastMoveTime >= 2000) {
        playerSprite = "🧎‍➡️";
      }
      
      // Tegn spilleren
      ctx.font = "40px serif";
      ctx.fillText(playerSprite, player.x, player.y + player.height);

      // Tegn poengsummen
      ctx.fillStyle = "#000";
      ctx.font = "20px sans-serif";
      ctx.fillText("Score: " + score, 10, 30);

      // Tegn konfetti hvis aktivert
      if(confettiActive) {
        ctx.font = "20px serif";
        confettiParticles.forEach(p => {
          ctx.fillText(p.emoji, p.x, p.y);
        });
      }
    }

    // Start spill-løkken
    gameLoop();
  </script>
</body>
</html>
