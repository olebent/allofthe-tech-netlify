<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Emoji Plattformspill – Hard Mode</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      /* Standard bakgrunn, vil endres dynamisk ved nivåskifte */
      background: #87CEEB;
    }
    canvas {
      display: block;
      touch-action: none; /* Forhindrer standard scrolling */
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    // Hent canvas og kontekst
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    // Justerer størrelsen til å fylle hele vinduet
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Definer bakgrunnsfarger for de ulike nivåene
    const backgrounds = [
      "#87CEEB", // Nivå 1
      "#FFD700", // Nivå 2
      "#8A2BE2", // Nivå 3
      "#FF69B4", // Nivå 4
      "#7FFFD4", // Nivå 5
      "#00FA9A", // Nivå 6
      "#FF4500", // Nivå 7
      "#DA70D6", // Nivå 8
      "#40E0D0", // Nivå 9
      "#FFDEAD"  // Nivå 10
    ];

    // Globale variabler
    let score = 0;
    let currentLevelIndex = 0;
    let levels = [];
    let player = {};
    // keys vil bli satt basert på touch-posisjon
    let keys = { left: false, right: false, up: false };

    const gravity = 0.5;
    const jumpVelocity = -12;
    const moveSpeed = 5;
    // Tillatt nedstigning – økt fra 20 til 100 for å unngå at man faller av når neste plattform ligger mye lavere.
    const dropThreshold = 100;
    // Reduserer plattform-kollisjonsboksen med noen piksler slik at hitboxen stemmer bedre med tegningen
    const hitMargin = 5;

    let lastMoveTime = Date.now();
    // Ved nivåfullføring vises spilleren med 🤸 i 300 ms
    let levelCompleteTime = null;

    // Dyr som kan dukke opp (utenom bjørnen)
    const animalTypes = ["🦘", "🦑", "🫎", "🦙", "🐙", "🐖", "🐄", "🐂", "🐨"];

    // Oppretter nivåer med plattformer, creatures (bjørn og andre dyr) og finish-område
    function createLevels() {
      let lvls = [];
      // Nivå 1: Én stor plattform og én creature (bjørn)
      {
        let platforms = [
          { x: 0, y: canvas.height - 50, width: canvas.width, height: 50 }
        ];
        let creatures = [];
        creatures.push({
          x: canvas.width / 2,
          y: canvas.height - 90,
          width: 40,
          height: 40,
          alive: true,
          explosionTime: 0,
          vx: (Math.random() < 0.5 ? -1 : 1) * ((Math.random() * 2 + 1) * 0.5),
          vy: 0,
          type: "🐻",
          platformX: 0,
          platformRight: canvas.width,
          platformY: canvas.height - 50,
          jumpCooldown: 0
        });
        lvls.push({
          platforms: platforms,
          creatures: creatures,
          finish: { x: canvas.width - 100, y: canvas.height - 100, width: 50, height: 50 }
        });
      }
      // Nivå 2 til 10 med flere plattformer og creatures
      for (let i = 2; i <= 10; i++) {
        let platforms = [];
        let creatures = [];
        const platformCount = 5 + i; // Flere plattformer for høyere nivåer
        const platformWidth = canvas.width / platformCount;
        // Vi lager plattformer med en moderat variasjon i høyde.
        // For å unngå uhensiktsmessige hopp, bruker vi den forrige plattformens y-verdi som basis.
        let lastY = canvas.height - 50;
        for (let j = 0; j < platformCount; j++) {
          let x = j * platformWidth;
          // Velg y med en variasjon, men begrens den slik at neste plattform ikke havner langt høyere enn forrige
          let y = lastY - (Math.random() * 20 - 10);
          // Sørg for at plattformene ikke går utenfor skjermen
          y = Math.min(canvas.height - 50, Math.max(50, y));
          platforms.push({ x: x, y: y, width: platformWidth - 20, height: 20 });
          lastY = y;
          // 40% sjanse for å legge til en bjørn (🐻)
          if (Math.random() < 0.4) {
            creatures.push({
              x: x + (platformWidth - 20) / 2 - 20,
              y: y - 40,
              width: 40,
              height: 40,
              alive: true,
              explosionTime: 0,
              vx: (Math.random() < 0.5 ? -1 : 1) * ((Math.random() * 2 + 1) * 0.5),
              vy: 0,
              type: "🐻",
              platformX: x,
              platformRight: x + platformWidth - 20,
              platformY: y,
              jumpCooldown: 0
            });
          }
          // 15% sjanse for å legge til et annet dyr (tilfeldig valgt)
          if (Math.random() < 0.15) {
            let type = animalTypes[Math.floor(Math.random() * animalTypes.length)];
            creatures.push({
              x: x + Math.random() * ((platformWidth - 20) - 40),
              y: y - 40,
              width: 40,
              height: 40,
              alive: true,
              explosionTime: 0,
              vx: (Math.random() < 0.5 ? -1 : 1) * ((Math.random() * 2 + 1) * 0.5),
              vy: 0,
              type: type,
              platformX: x,
              platformRight: x + platformWidth - 20,
              platformY: y,
              jumpCooldown: 0
            });
          }
        }
        // Legg til en siste plattform nær finish-området
        platforms.push({ x: canvas.width - 150, y: canvas.height - 150, width: 150, height: 20 });
        lvls.push({
          platforms: platforms,
          creatures: creatures,
          finish: { x: canvas.width - 100, y: canvas.height - 200, width: 50, height: 50 }
        });
      }
      return lvls;
    }
    levels = createLevels();

    // Spilleren plasseres alltid oppå den første plattformen i nivået.
    function resetPlayer() {
      let level = levels[currentLevelIndex];
      let startPlatform = level.platforms[0];
      player = {
        x: startPlatform.x + 10,
        y: startPlatform.y - 40,
        width: 40,
        height: 40,
        vx: 0,
        vy: 0,
        onGround: false,
        lastPlatformY: startPlatform.y,
        hasJumped: false
      };
      lastMoveTime = Date.now();
    }
    resetPlayer();

    // Tastaturhåndtering for desktop
    document.addEventListener('keydown', function(e) {
      if(e.key === "ArrowLeft" || e.key === "a") keys.left = true;
      if(e.key === "ArrowRight" || e.key === "d") keys.right = true;
      if(e.key === "ArrowUp" || e.key === "w" || e.key === " ") {
        if(player.onGround) {
          player.vy = jumpVelocity;
          player.onGround = false;
          player.hasJumped = true;
        }
        keys.up = true;
      }
    });
    document.addEventListener('keyup', function(e) {
      if(e.key === "ArrowLeft" || e.key === "a") keys.left = false;
      if(e.key === "ArrowRight" || e.key === "d") keys.right = false;
      if(e.key === "ArrowUp" || e.key === "w" || e.key === " ") keys.up = false;
    });

    // Touch-hendelser for mobile.
    // Vi deler skjermen i tre soner:
    // - Øverste tredjedel: hopp
    // - Venstre halvdel (ikke i øverste tredjedel): venstre
    // - Høyre halvdel (ikke i øverste tredjedel): høyre
    function handleTouches(e) {
      // Nullstill alle nøkkelverdier
      keys.left = false;
      keys.right = false;
      keys.up = false;
      for (let i = 0; i < e.touches.length; i++) {
        let touch = e.touches[i];
        let x = touch.clientX;
        let y = touch.clientY;
        if (y < window.innerHeight / 3) {
          keys.up = true;
        } else {
          if (x < window.innerWidth / 2) {
            keys.left = true;
          } else {
            keys.right = true;
          }
        }
      }
    }
    canvas.addEventListener('touchstart', function(e) {
      handleTouches(e);
      e.preventDefault();
    });
    canvas.addEventListener('touchmove', function(e) {
      handleTouches(e);
      e.preventDefault();
    });
    canvas.addEventListener('touchend', function(e) {
      // Hvis ingen touches er igjen, nullstill alle kontroller
      if(e.touches.length === 0){
        keys.left = false;
        keys.right = false;
        keys.up = false;
      }
      e.preventDefault();
    });

    // Konfetti-variabler
    let confettiParticles = [];
    let confettiActive = false;
    function startConfetti() {
      confettiActive = true;
      for(let i = 0; i < 100; i++){
        confettiParticles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.5) * 10,
          emoji: Math.random() < 0.5 ? "🎉" : "🎊",
          life: 100
        });
      }
    }

    // Spill-løkken
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // Oppdaterer spilltilstanden
    function update() {
      let level = levels[currentLevelIndex];

      // Spilleren beveger seg horisontalt basert på keys
      if(keys.left) {
        player.vx = -moveSpeed;
      } else if(keys.right) {
        player.vx = moveSpeed;
      } else {
        player.vx = 0;
      }
      if(Math.abs(player.vx) > 0) {
        lastMoveTime = Date.now();
      }

      // Påfører tyngdekraft og oppdaterer spillerposisjon
      player.vy += gravity;
      player.x += player.vx;
      player.y += player.vy;

      // Sjekk kollisjon med plattformer
      player.onGround = false;
      for(let plat of level.platforms) {
        if(player.x < plat.x + plat.width - hitMargin &&
           player.x + player.width > plat.x + hitMargin &&
           player.y < plat.y + plat.height &&
           player.y + player.height > plat.y) {
          let drop = plat.y - player.lastPlatformY;
          // Vi fjerner den gamle sjekken for for stor nedstigning slik at spilleren lander hvis treffet er nær nok
          if(player.vy >= 0 && (player.y + player.height - plat.y) < 30) {
            player.y = plat.y - player.height;
            player.vy = 0;
            player.onGround = true;
            player.lastPlatformY = plat.y;
            player.hasJumped = false;
          }
        }
      }

      // Hold spilleren innenfor horisontal skjerm
      if(player.x < 0) player.x = 0;
      if(player.x + player.width > canvas.width) player.x = canvas.width - player.width;
      // Om spilleren faller ut av skjermen, tilbakestill posisjon (beholder score)
      if(player.y > canvas.height) {
        resetPlayer();
      }

      // Oppdater creatures (bjørn og andre dyr)
      level.creatures.forEach(creature => {
        if(creature.alive) {
          if(player.x < creature.x + creature.width &&
             player.x + player.width > creature.x &&
             player.y < creature.y + creature.height &&
             player.y + player.height > creature.y) {
            if(player.vy > 0 && (player.y + player.height - creature.y) < 20) {
              creature.alive = false;
              creature.explosionTime = Date.now() + 200;
              score += 100;
              player.vy = jumpVelocity / 2;
            } else {
              if(player.x + player.width/2 < creature.x + creature.width/2) {
                player.x -= 10;
                player.vx = -moveSpeed;
              } else {
                player.x += 10;
                player.vx = moveSpeed;
              }
            }
          }
        } else {
          if(creature.explosionTime && Date.now() > creature.explosionTime) {
            creature.remove = true;
          }
        }

        // Oppdater creature-bevegelse – de holder seg på sin plattform
        if(creature.y >= creature.platformY - creature.height - 1) {
          creature.y = creature.platformY - creature.height;
          creature.vy = 0;
          if(creature.jumpCooldown <= 0 && Math.random() < 0.01) {
            creature.vy = jumpVelocity * 0.8;
            creature.jumpCooldown = 50;
          }
        } else {
          creature.vy += gravity;
        }
        creature.x += creature.vx;
        creature.y += creature.vy;
        if(creature.jumpCooldown > 0) creature.jumpCooldown--;
        if(creature.x < creature.platformX) {
          creature.x = creature.platformX;
          creature.vx *= -1;
        }
        if(creature.x + creature.width > creature.platformRight) {
          creature.x = creature.platformRight - creature.width;
          creature.vx *= -1;
        }
        if(Math.random() < 0.005) {
          creature.vx *= -1;
        }
      });
      level.creatures = level.creatures.filter(c => !c.remove);

      // Sjekk om spilleren har nådd finish (🚪)
      let finish = level.finish;
      if(player.x < finish.x + finish.width &&
         player.x + player.width > finish.x &&
         player.y < finish.y + finish.height &&
         player.y + player.height > finish.y) {
        if(currentLevelIndex < levels.length - 1) {
          if(!levelCompleteTime) {
            levelCompleteTime = Date.now();
          } else if(Date.now() - levelCompleteTime >= 300) {
            currentLevelIndex++;
            resetPlayer();
            levelCompleteTime = null;
            document.body.style.background = backgrounds[currentLevelIndex] || "#87CEEB";
          }
        } else {
          if(!levelCompleteTime) {
            levelCompleteTime = Date.now();
          } else if(Date.now() - levelCompleteTime >= 300) {
            startConfetti();
          }
        }
      }

      // Oppdater konfetti
      if(confettiActive) {
        confettiParticles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.life--;
        });
        confettiParticles = confettiParticles.filter(p => p.life > 0);
      }
    }

    // Tegn alle spillobjektene
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let level = levels[currentLevelIndex];
      ctx.fillStyle = "#654321";
      level.platforms.forEach(plat => {
        ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
      });
      let finish = level.finish;
      ctx.font = "30px serif";
      ctx.fillText("🚪", finish.x, finish.y + finish.height);
      ctx.font = "40px serif";
      level.creatures.forEach(creature => {
        if(creature.alive) {
          ctx.fillText(creature.type, creature.x, creature.y + creature.height);
        } else {
          if(Date.now() < creature.explosionTime) {
            ctx.fillText("💥", creature.x, creature.y + creature.height);
          }
        }
      });
      let playerSprite = "🧍";
      if(levelCompleteTime && Date.now() - levelCompleteTime < 300) {
        playerSprite = "🤸";
      } else if(Math.abs(player.vx) > 0) {
        playerSprite = "🏃";
      } else if(Date.now() - lastMoveTime >= 2000) {
        playerSprite = "🧎‍➡️";
      }
      ctx.font = "40px serif";
      ctx.fillText(playerSprite, player.x, player.y + player.height);
      ctx.fillStyle = "#000";
      ctx.font = "20px sans-serif";
      ctx.fillText("Score: " + score, 10, 30);
      ctx.fillText("Nivå: " + (currentLevelIndex + 1), 10, 60);
      if(confettiActive) {
        ctx.font = "20px serif";
        confettiParticles.forEach(p => {
          ctx.fillText(p.emoji, p.x, p.y);
        });
      }
    }

    gameLoop();
  </script>
</body>
</html>
