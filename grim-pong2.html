<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Grimsmyra-pong</title>
  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: sans-serif;
      overflow: hidden;
    }
    #gameCanvas {
      display: block;
      margin: 0 auto;
      background: black;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <script>
    // Initialisering og globale variabler
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let gameState = "toast"; // Mulige verdier: "toast", "playing"
    let toast = null; // Inneholder melding, varighet o.l.

    let score = 0;
    let level = 1;
    const maxLevel = 10;
    
    // Start-tid for økt farts-oppgradering hvert 30. sekund
    let lastSpeedIncreaseTime = Date.now();

    // Farger for murstein (bricks)
    const colorHealth3 = "#228B22"; // Grønn (gress)
    const colorHealth2 = "#8B4513"; // Brun (jord)
    const colorHealth1 = "#808080"; // Grå

    // Paddle-objektet – styrt med musen
    const paddle = {
      width: 100,
      height: 15,
      x: canvas.width / 2 - 50,
      y: canvas.height - 40,
      update: function(mouseX) {
        this.x = mouseX - this.width / 2;
        if (this.x < 0) this.x = 0;
        if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;
      },
      // Tegn paddlen med en konveks kurve øverst
      draw: function() {
        ctx.fillStyle = "white";
        ctx.beginPath();
        // Start nederst til venstre
        ctx.moveTo(this.x, this.y + this.height);
        // Gå opp til midten på venstre side
        ctx.lineTo(this.x, this.y + this.height/2);
        // Tegn en kvadratisk kurve med kontrollpunkt over midten
        ctx.quadraticCurveTo(this.x + this.width/2, this.y - 10, this.x + this.width, this.y + this.height/2);
        // Gå ned til nederst til høyre
        ctx.lineTo(this.x + this.width, this.y + this.height);
        ctx.closePath();
        ctx.fill();
      }
    };

    // Ball-objektet – vises som fotball-emoji med spin
    const ball = {
      radius: 15,
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: 4,
      vy: -4,
      spin: 0,   // Start uten spin
      draw: function() {
        ctx.font = "30px 'Segoe UI Emoji', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("⚽", this.x, this.y);
      },
      update: function() {
        this.x += this.vx;
        this.y += this.vy;
        // Påvirk retningen litt av spin (kun en beskjeden påvirkning)
        this.vx += this.spin * 0.02;
        // Reduser spin over tid (friksjonseffekt)
        this.spin *= 0.995;
        
        // Sjekk kollisjon med venstre og høyre vegg og korriger posisjon og retning
        if (this.x - this.radius < 0) {
          this.x = this.radius;
          this.vx = Math.abs(this.vx);
        } else if (this.x + this.radius > canvas.width) {
          this.x = canvas.width - this.radius;
          this.vx = -Math.abs(this.vx);
        }
        // Kollisjon med toppen
        if (this.y - this.radius < 0) {
          this.y = this.radius;
          this.vy = Math.abs(this.vy);
        }
      },
      reset: function() {
        this.x = canvas.width / 2;
        this.y = canvas.height / 2;
        // Behold den nåværende hastighetsøkningen for nivåer og 30-sekunders opptrapping
      }
    };

    // Funksjon for å lage murstein (bricks) for et gitt nivå
    function createBricks(currentLevel) {
      let bricks = [];
      // Nivå 1: 3 rader, nivå 2: 4 rader, osv.
      let rows = 3 + (currentLevel - 1);
      let cols = 7;
      let brickWidth = canvas.width / cols;
      let brickHeight = 20;
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          let brick = {
            x: col * brickWidth + 5,
            y: row * (brickHeight + 5) + 50,
            width: brickWidth - 10,
            height: brickHeight,
            health: 3
          };
          bricks.push(brick);
        }
      }
      return bricks;
    }
    let bricks = createBricks(level);

    // Musbevegelse for å styre paddle
    canvas.addEventListener("mousemove", function(e) {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      paddle.update(mouseX);
    });

    // Funksjon for å vise toast-meldinger (blokkert i et par sekunder)
    function showToast(message, duration, nextState, callback) {
      toast = {
        message: message,
        duration: duration,
        startTime: Date.now(),
        nextState: nextState,
        callback: callback
      };
      gameState = "toast";
    }

    // Startmelding
    showToast("Grimsmyra-pong!", 3000, "playing", null);

    // Tegn alle spill-elementene
    function drawGame() {
      // Bakgrunn
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Score og nivå
      ctx.fillStyle = "white";
      ctx.font = "20px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("Score: " + score + "   Nivå: " + level, 10, 30);

      // Tegn mursteinene
      bricks.forEach(function(brick) {
        if (brick.health === 3) ctx.fillStyle = colorHealth3;
        else if (brick.health === 2) ctx.fillStyle = colorHealth2;
        else if (brick.health === 1) ctx.fillStyle = colorHealth1;
        ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
      });

      // Tegn paddle og ball
      paddle.draw();
      ball.draw();

      // Tegn en hvit ramme rundt hele canvas (gjør at man lettere ser spillområdet)
      ctx.strokeStyle = "white";
      ctx.lineWidth = 5;
      ctx.strokeRect(0, 0, canvas.width, canvas.height);
    }

    // Sjekk kollisjoner mellom ball og paddle/mursteinene
    function checkCollisions() {
      // Kollisjon med paddle:
      if (
         ball.y + ball.radius >= paddle.y &&
         ball.y + ball.radius < paddle.y + paddle.height &&
         ball.x >= paddle.x &&
         ball.x <= paddle.x + paddle.width
      ) {
         // Beregn treffpunktets posisjon relativt til midten (-1 til 1)
         const paddleCenter = paddle.x + paddle.width / 2;
         const relativeIntersect = (ball.x - paddleCenter) / (paddle.width / 2);

         // Maks vinkel er 60° (π/3)
         const maxBounceAngle = Math.PI / 3;
         const bounceAngle = relativeIntersect * maxBounceAngle;

         // Behold den totale hastigheten (fart) til ballen
         const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);

         // Beregn ny hastighetskomponentene, med vekt på treffpunktet
         ball.vx = speed * Math.sin(bounceAngle);
         ball.vy = -Math.abs(speed * Math.cos(bounceAngle));

         // Sett spin basert på treffpunktet – ballen "snurrer" litt
         ball.spin = relativeIntersect * 2;  // Juster denne faktoren for ønsket effekt

         // Reposisjonér ballen for å hindre at den "setter seg fast" i paddlen
         ball.y = paddle.y - ball.radius;
      }
      
      // Kollisjon med mursteinene (bricks)
      for (let i = 0; i < bricks.length; i++) {
        let brick = bricks[i];
        if (
          ball.x + ball.radius > brick.x &&
          ball.x - ball.radius < brick.x + brick.width &&
          ball.y + ball.radius > brick.y &&
          ball.y - ball.radius < brick.y + brick.height
        ) {
          // Enkel løsning: snu vertikal retning
          ball.vy = -ball.vy;
          brick.health--;
          if (brick.health <= 0) {
            bricks.splice(i, 1);
            score++;
          }
          break; // Bare én kollisjon per frame
        }
      }
    }

    // Sjekk status for spillet (nivå-fullføring, game over)
    function checkGameStatus() {
      // Hvis ballen faller under canvas, vis "Game Over"
      if (ball.y - ball.radius > canvas.height) {
        showToast("Game Over!", 3000, "playing", function() {
          // Tilbakestill spillverdier
          score = 0;
          level = 1;
          bricks = createBricks(level);
          ball.vx = 4;
          ball.vy = -4;
          ball.spin = 0;
          ball.reset();
        });
      }
      // Hvis alle mursteinene er ødelagt, gå til neste nivå
      if (bricks.length === 0) {
        if (level < maxLevel) {
          level++;
          // Øk ballens fart med 10% for hvert nivå
          ball.vx *= 1.1;
          ball.vy *= 1.1;
          bricks = createBricks(level);
          showToast("Er du klar for nivå " + level + "? Hvis ikke blir det slåsskamp bak bakeriet klokka 2!", 3000, "playing", function() {
            ball.reset();
          });
        } else {
          // Spill vunnet
          showToast("Gratulerer, du vant!", 3000, "game_over", null);
        }
      }
    }

    // Spill-løkken – kjører med requestAnimationFrame
    function gameLoop() {
      if (gameState === "playing") {
        // Øk ballfarten litt for hvert 30. sekund
        if (Date.now() - lastSpeedIncreaseTime > 30000) {
          ball.vx *= 1.03;
          ball.vy *= 1.03;
          lastSpeedIncreaseTime = Date.now();
        }
        ball.update();
        checkCollisions();
        checkGameStatus();
        drawGame();
      } else if (gameState === "toast") {
        // Tegn spillbakgrunn og overlegg med toast-melding
        drawGame();
        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.font = "24px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(toast.message, canvas.width / 2, canvas.height / 2);
        if (Date.now() - toast.startTime > toast.duration) {
          gameState = toast.nextState;
          if (toast.callback) toast.callback();
          toast = null;
        }
      }
      requestAnimationFrame(gameLoop);
    }
    gameLoop();
  </script>
</body>
</html>
