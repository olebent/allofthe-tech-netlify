<!doctype html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Plattformspill</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #222;
      overflow: hidden;
    }
    canvas {
      display: block;
      background: #333;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <!-- Canvas satt til 500x844, f.eks. for iPhone 14-portrett -->
  <canvas id="gameCanvas" width="500" height="844"></canvas>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Globale variabler og nivådata
    let level = 1;
    const maxLevel = 7;
    let platforms = [];
    let enemies = [];
    let toastMessage = "";
    let toastTimer = 0;
    let levelWidth = canvas.width; // skal beregnes når nivået genereres
    let idleTimer = 0; // teller frames der spilleren står stille
    let currentPlayerEmoji = "🧍";

    // Konstanter
    const GRAVITY = 0.8;
    const PLAYER_SPEED = 3;
    const JUMP_STRENGTH = 15;
    const LAVA_HEIGHT = 50;
    const PLAYER_WIDTH = 30;
    const PLAYER_HEIGHT = 40;

    // Liste over fiende-emoji
    const enemyEmojis = [
      "🦘", "🦑", "🫎", "🦙", "🐙", "🐖", "🐄", "🐂", "🐨",
      "🦌", "🦬", "🐗", "🦏", "🪿", "🦅", "🐒", "🦍", "🦆",
      "🐀", "🐁"
    ];

    // Spilleren
    const player = {
      x: 0,
      y: 0,
      width: PLAYER_WIDTH,
      height: PLAYER_HEIGHT,
      velocityX: 0,
      velocityY: 0,
      onGround: false
    };

    // Kontrollvariabler
    const keys = {};
    let touchLeft = false, touchRight = false;

    document.addEventListener("keydown", (e) => { keys[e.code] = true; });
    document.addEventListener("keyup", (e) => { keys[e.code] = false; });

    canvas.addEventListener("pointerdown", (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      if (y < canvas.height / 3) { // øverste tredjedel: hopp
        if (player.onGround) {
          player.velocityY = -JUMP_STRENGTH;
          player.onGround = false;
          idleTimer = 0;
        }
      } else {
        // Nederste to tredjedeler: horisontal retning
        if (x < canvas.width / 2) {
          touchLeft = true;
        } else {
          touchRight = true;
        }
      }
    });

    canvas.addEventListener("pointerup", (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      if (y >= canvas.height / 3) {
        if (x < canvas.width / 2) {
          touchLeft = false;
        } else {
          touchRight = false;
        }
      }
    });

    // Enkel rektangulær kollisjonsdeteksjon
    function checkCollision(a, b) {
      return a.x < b.x + b.width &&
             a.x + a.width > b.x &&
             a.y < b.y + b.height &&
             a.y + a.height > b.y;
    }

    // Generer nivå med horisontal progresjon
    function generateLevel(level) {
      const numPlatforms = 6 + (level - 1) * 2; // f.eks. 6 på nivå 1, deretter +2 for hvert nivå
      const plats = [];
      let startX = 50; // startplattformen begynner her
      let currentX = startX;
      const platformWidth = 150; // bredere plattformer
      for (let i = 0; i < numPlatforms; i++) {
        // Sett et gap mellom 100 og 200 piksler mellom plattformene
        let gap = (i === 0 ? 0 : 100 + Math.random() * 100);
        currentX += gap;
        let platformX = currentX;
        let platformY;
        if (i === 0) {
          // Startplattformen plasseres i en fast høyde (100 piksler over lavaen)
          platformY = canvas.height - LAVA_HEIGHT - 100;
        } else {
          // Y-verdien varieres slik at plattformene ligger et sted mellom 150 og (canvas høyde - lava - 150)
          platformY = 150 + Math.random() * (canvas.height - LAVA_HEIGHT - 250);
        }
        const type = (i === numPlatforms - 1) ? "cake" : "normal";
        plats.push({ x: platformX, y: platformY, width: platformWidth, height: 20, type: type });
      }
      // Definer nivåets totale bredde – siste plattform + margin
      levelWidth = plats[plats.length - 1].x + platformWidth + 50;
      return plats;
    }

    function initLevel() {
      platforms = generateLevel(level);
      // Plasser spilleren på startplattformen
      const startPlat = platforms[0];
      player.x = startPlat.x + (startPlat.width - player.width) / 2;
      player.y = startPlat.y - player.height;
      player.velocityX = 0;
      player.velocityY = 0;
      player.onGround = true;
      idleTimer = 0;
      currentPlayerEmoji = "🧍";

      // Generer fiender på plattformer (unntatt start og kake-plattform)
      enemies = [];
      for (let i = 1; i < platforms.length - 1; i++) {
        if (Math.random() < 0.7) {
          const plat = platforms[i];
          const enemyWidth = 30, enemyHeight = 30;
          const ex = plat.x + Math.random() * (plat.width - enemyWidth);
          const ey = plat.y - enemyHeight;
          const velocityX = (Math.random() < 0.5 ? -1 : 1) * (1 + Math.random());
          enemies.push({
            x: ex,
            y: ey,
            width: enemyWidth,
            height: enemyHeight,
            velocityX: velocityX,
            velocityY: 0,
            platform: plat,
            emoji: enemyEmojis[Math.floor(Math.random() * enemyEmojis.length)]
          });
        }
      }
    }

    initLevel();

    // Gå til neste nivå – bytt emoji til 🤸 når nivået fullføres, og til slutt 🧑‍🎓
    function nextLevel() {
      if (level < maxLevel) {
        currentPlayerEmoji = "🤸";
        toastMessage = "du fant kaken - neste nivå!";
        toastTimer = 120;
        setTimeout(() => {
          level++;
          toastMessage = "";
          initLevel();
        }, 2000);
      } else {
        toastMessage = "Du klarte det! Nå, gå og spill Portal i stedet";
        currentPlayerEmoji = "🧑‍🎓";
        player.velocityX = 0;
        player.velocityY = 0;
      }
    }

    function update() {
      // Spillerkontroll: Tastatur eller berøring
      const movingLeft = keys["ArrowLeft"] || touchLeft;
      const movingRight = keys["ArrowRight"] || touchRight;
      if (movingLeft) {
        player.velocityX = -PLAYER_SPEED;
      } else if (movingRight) {
        player.velocityX = PLAYER_SPEED;
      } else {
        player.velocityX = 0;
      }
      if ((keys["ArrowUp"] || keys["Space"]) && player.onGround) {
        player.velocityY = -JUMP_STRENGTH;
        player.onGround = false;
        idleTimer = 0;
      }
      player.velocityY += GRAVITY;

      // Oppdater posisjon
      player.x += player.velocityX;
      player.y += player.velocityY;

      // Kollisjon horisontalt med fiender
      enemies.forEach(enemy => {
        if (checkCollision(player, enemy)) {
          if (player.velocityX > 0) {
            player.x = enemy.x - player.width;
          } else if (player.velocityX < 0) {
            player.x = enemy.x + enemy.width;
          }
          player.velocityX = 0;
        }
      });
      // Vertikal kollisjon med fiender
      enemies.forEach(enemy => {
        if (checkCollision(player, enemy)) {
          if (player.velocityY > 0) {
            player.y = enemy.y - player.height;
            player.onGround = true;
          } else if (player.velocityY < 0) {
            player.y = enemy.y + enemy.height;
          }
          player.velocityY = 0;
        }
      });

      // Plattformkollisjon
      player.onGround = false;
      platforms.forEach(plat => {
        if (player.velocityY >= 0) {
          if (
            player.x + player.width > plat.x &&
            player.x < plat.x + plat.width &&
            player.y + player.height >= plat.y &&
            player.y + player.height - player.velocityY < plat.y
          ) {
            player.y = plat.y - player.height;
            player.velocityY = 0;
            player.onGround = true;
            if (plat.type === "cake" && !toastMessage) {
              nextLevel();
            }
          }
        }
      });

      // Hvis spilleren faller ned i lavaen, start nivået på nytt
      if (player.y > canvas.height - LAVA_HEIGHT) {
        initLevel();
      }

      // Oppdater fiender
      enemies.forEach(enemy => {
        enemy.velocityY += GRAVITY;
        enemy.x += enemy.velocityX;
        if (enemy.x < enemy.platform.x) {
          enemy.x = enemy.platform.x;
          enemy.velocityX *= -1;
        }
        if (enemy.x + enemy.width > enemy.platform.x + enemy.platform.width) {
          enemy.x = enemy.platform.x + enemy.platform.width - enemy.width;
          enemy.velocityX *= -1;
        }
        if (enemy.y + enemy.height > enemy.platform.y) {
          enemy.y = enemy.platform.y - enemy.height;
          enemy.velocityY = 0;
        }
        if (enemy.velocityY === 0 && Math.random() < 0.005) {
          enemy.velocityY = -JUMP_STRENGTH * (0.8 + Math.random() * 0.4);
        }
      });

      // Oppdater idle-teller: dersom spilleren står stille og er på bakken, øk idleTimer
      if (Math.abs(player.velocityX) < 0.1 && player.onGround) {
        idleTimer++;
      } else {
        idleTimer = 0;
      }
      // Oppdater spillerens emoji (med mindre vi viser toastmelding for nivåfullføring)
      if (!toastMessage) {
        if (player.velocityX > 0) {
          currentPlayerEmoji = "🏃➡️";
        } else if (idleTimer >= 60) { // ett sekund (60 frames)
          currentPlayerEmoji = "🧎‍➡️";
        } else {
          currentPlayerEmoji = "🧍";
        }
      }
    }

    function draw() {
      // Beregn kamera-offset: senter spilleren horisontalt
      let cameraX = player.x - canvas.width / 2;
      if (cameraX < 0) cameraX = 0;
      if (cameraX > levelWidth - canvas.width) cameraX = levelWidth - canvas.width;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#222";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Tegn lavaen – i verdenskoordinater, slik at den også skifter med kamera
      ctx.fillStyle = "red";
      ctx.fillRect(cameraX, canvas.height - LAVA_HEIGHT, canvas.width, LAVA_HEIGHT);

      // Tegn plattformene
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "20px sans-serif";
      platforms.forEach(plat => {
        const emoji = (plat.type === "cake") ? "🍰" : "☁️";
        ctx.fillText(emoji, plat.x - cameraX + plat.width/2, plat.y + plat.height/2);
      });

      // Tegn fiender
      ctx.font = "30px sans-serif";
      enemies.forEach(enemy => {
        ctx.fillText(enemy.emoji, enemy.x - cameraX + enemy.width/2, enemy.y + enemy.height/2);
      });

      // Tegn spilleren med aktuell emoji
      ctx.font = "30px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(currentPlayerEmoji, player.x - cameraX + player.width/2, player.y + player.height/2);

      // HUD – nivåinformasjon
      ctx.font = "16px sans-serif";
      ctx.textAlign = "left";
      ctx.fillStyle = "#fff";
      ctx.fillText("Nivå: " + level, cameraX + 10, 20);

      // Toast-melding om aktuelt
      if (toastMessage) {
        ctx.font = "24px sans-serif";
        ctx.textAlign = "center";
        ctx.fillStyle = "yellow";
        ctx.fillText(toastMessage, cameraX + canvas.width/2, canvas.height/2);
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
    gameLoop();
  </script>
</body>
</html>
